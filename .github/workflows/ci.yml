name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: php-${{ matrix.php }}

      # ext-php-rs generates its PHP bindings with bindgen, which needs libclang.
      - name: Install libclang
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      - name: Build
        run: cargo build --release

      - name: Test
        run: php -d extension=$PWD/target/release/libexcel_rs.so tests/roundtrip.php

      - uses: actions/upload-artifact@v4
        with:
          name: excel_rs-php${{ matrix.php }}-linux-x86_64
          path: target/release/libexcel_rs.so
