name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  linux:
    name: Linux / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: php-${{ matrix.php }}

      # ext-php-rs generates its PHP bindings with bindgen. The libclang it
      # loads and the clang whose headers it uses must be the same version;
      # runner images ship several, so pin both to the newest one installed.
      - name: Set up libclang
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev
          v=$(ls /usr/lib | sed -n 's/^llvm-\([0-9]\+\)$/\1/p' | sort -n | tail -1)
          sudo apt-get install -y "clang-$v" "libclang-$v-dev"
          echo "LIBCLANG_PATH=/usr/lib/llvm-$v/lib" >> "$GITHUB_ENV"
          echo "CLANG_PATH=/usr/bin/clang-$v" >> "$GITHUB_ENV"

      - name: Build
        run: |
          set -o pipefail
          cargo build --release 2>&1 | tee build.log

      # Surface the end of the build output as an annotation on failure.
      - name: Report build failure
        if: failure()
        run: |
          msg=$(grep -vE '^\s*(Compiling|Downloaded|Downloading)' build.log | tail -60)
          msg="${msg//'%'/'%25'}"; msg="${msg//$'\n'/'%0A'}"; msg="${msg//$'\r'/'%0D'}"
          echo "::error title=Build output::$msg"

      - name: Test
        run: php -d extension=$PWD/target/release/libexcel_rs.so tests/roundtrip.php

      - uses: actions/upload-artifact@v4
        with:
          name: excel_rs-php${{ matrix.php }}-nts-linux-x86_64
          path: target/release/libexcel_rs.so

  windows:
    name: Windows / PHP ${{ matrix.php }} ${{ matrix.ts }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        ts: [nts, ts]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
        env:
          phpts: ${{ matrix.ts }}

      # ext-php-rs needs nightly Rust on Windows (vectorcall ABI).
      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2
        with:
          key: php-${{ matrix.php }}-${{ matrix.ts }}

      - name: Build
        env:
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
        run: |
          set -o pipefail
          cargo build --release 2>&1 | tee build.log

      - name: Report build failure
        if: failure()
        run: |
          msg=$(grep -vE '^\s*(Compiling|Downloaded|Downloading)' build.log | tail -60)
          msg="${msg//'%'/'%25'}"; msg="${msg//$'\n'/'%0A'}"; msg="${msg//$'\r'/'%0D'}"
          echo "::error title=Build output::$msg"

      - name: Test
        run: php -d extension="$(cygpath -w "$PWD/target/release/excel_rs.dll")" tests/roundtrip.php

      - uses: actions/upload-artifact@v4
        with:
          name: excel_rs-php${{ matrix.php }}-${{ matrix.ts }}-windows-x86_64
          path: target/release/excel_rs.dll

  # Collect every build under a descriptive file name. On a version tag the
  # files are also published as a GitHub release.
  package:
    name: Package
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Rename binaries
        run: |
          mkdir dist
          for dir in artifacts/*/; do
            name=$(basename "$dir")
            for file in "$dir"*; do
              cp "$file" "dist/$name.${file##*.}"
            done
          done
          (cd dist && sha256sum * > SHA256SUMS)
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: excel_rs-all
          path: dist

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match Cargo.toml version $version"
            exit 1
          fi
          gh release create "$TAG" dist/* --title "$TAG" --generate-notes \
            --notes "Pick the file that matches your PHP version, thread safety (\`php -i | grep 'Thread Safety'\`) and platform. See the README for installation."
